<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>In-house Books</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    body {
      background-color: #FFF0D7;
      position: relative;
      min-height: 100vh;
      font-family: sans-serif;
    }
    .book-card {
      transition: transform 0.3s;
    }
    .book-card:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body class="relative text-gray-800 overflow-x-hidden overflow-y-auto">
  <!-- Background decorative images -->
  <img src="images/img1.png" alt="Decor 1" class="absolute top-0 left-0 w-[450px] opacity-20 z-0 pointer-events-none">
  
  <!-- Fixed navbar -->
  <nav class="fixed top-0 left-0 w-full flex justify-between items-center px-4 md:px-6 py-8 z-50 bg-[#FFF0D7] bg-opacity-90">
    <div class="text-xl font-bold"><img src="images/entelogo-removebg-preview.png" alt="Logo" style="height: 100px; width: auto;"></div>
    <ul class="hidden md:flex space-x-12 font-medium" style="color: #7B3D00;">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#editor">Editor</a></li>
      <li><a href="index.html#writer">Writer</a></li>
      <li><a href="in-house.html" class="relative">In-house<span class="absolute left-0 -bottom-1 w-full h-1 bg-[#EA9C1E] rounded-full"></span></a></li>
      <li><a href="index.html#feedback">Feedback</a></li>
    </ul>
    <div class="md:hidden text-2xl text-[#7B3D00] cursor-pointer">☰</div>
  </nav>

  <section class="relative z-40 pt-40 px-6 max-w-6xl mx-auto">
    <h1 class="text-4xl font-bold text-center mb-12" style="color: #7B3D00;">In-house Books</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
      <!-- Book 1 -->
      <a href="reader.html?book=Natyasasthram.pdf" class="book-card bg-white rounded-xl shadow-xl overflow-hidden block text-center pb-4 border border-[#DBC5A1]">
        <canvas id="canvas-natya" class="w-full h-[400px] object-cover border-b border-gray-200 bg-gray-100"></canvas>
        <h2 class="mt-4 text-xl font-bold text-[#7B3D00]">Natyasasthram</h2>
      </a>

      <!-- Book 2 -->
      <a href="reader.html?book=Thalam.pdf" class="book-card bg-white rounded-xl shadow-xl overflow-hidden block text-center pb-4 border border-[#DBC5A1]">
        <canvas id="canvas-thalam" class="w-full h-[400px] object-cover border-b border-gray-200 bg-gray-100"></canvas>
        <h2 class="mt-4 text-xl font-bold text-[#7B3D00]">Thalam</h2>
      </a>
    </div>
  </section>

  <script>
    // Initialize PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    async function renderThumb(pdfUrl, canvasId) {
      try {
        const loadingTask = pdfjsLib.getDocument(pdfUrl);
        const pdf = await loadingTask.promise;
        const page = await pdf.getPage(1);
        
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext('2d');
        
        // Setup viewport
        const viewport = page.getViewport({ scale: 1.5 });
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        
        const renderContext = {
          canvasContext: ctx,
          viewport: viewport
        };
        await page.render(renderContext).promise;
      } catch (err) {
        console.error('Error rendering ' + pdfUrl, err);
      }
    }

    // Render covers
    renderThumb('books/Natyasasthram.pdf', 'canvas-natya');
    renderThumb('books/Thalam.pdf', 'canvas-thalam');
  </script>
</body>
</html>
