    body {
      background-color: #FFF0D7;
      position: relative;
      min-height: 100vh;
    }

  section::-webkit-scrollbar {
    display: none;
  }
  section {
    scrollbar-width: none;
  }

  .scroller {
    display: flex;
    overflow-x: scroll;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    gap: 0;
    padding: 0 calc(50vw - min(max(250px, 55vw), 500px) / 2);
    scrollbar-width: none;
  }
  .scroller::-webkit-scrollbar {
    display: none;
  }

  .vector-slide {
    container-type: inline-size;
    flex: 0 0 clamp(250px, 55vw, 500px);
    scroll-snap-align: center;
    aspect-ratio: 1 / 1;
    position: relative;
    display: flex;
    justify-content: center;
    view-timeline: --slide-timeline inline;
    animation: slide-scale auto linear both;
    animation-timeline: --slide-timeline;
  }

  @keyframes slide-scale {
    0% { transform: scale(0.85); }
    50% { transform: scale(1); }
    100% { transform: scale(0.85); }
  }

  .vector-slide .overlay {
    animation: slide-overlay auto linear both;
    animation-timeline: --slide-timeline;
  }

  @keyframes slide-overlay {
    0%, 100% { background-color: transparent; }
    20%, 80% { background-color: rgba(163,138,99,0.6); }
    50% { background-color: rgba(234,156,30,0.35); }
  }

  .vector-slide .edition-text {
    animation: slide-text auto linear both;
    animation-timeline: --slide-timeline;
  }

  @keyframes slide-text {
    0%, 100% { opacity: 0; }
    20%, 80% { opacity: 0.5; }
    50% { opacity: 1; }
  @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes slideOutRight { from { transform: translateX(0); } to { transform: translateX(100%); } }
  @keyframes backdropFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes backdropFadeOut { from { opacity: 1; } to { opacity: 0; } }

  dialog[open] {
    animation: slideInRight 0.3s ease-out forwards;
  }
  dialog[open]::backdrop {
    animation: backdropFade 0.3s ease-out forwards;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
  }
  dialog.closing {
    animation: slideOutRight 0.3s ease-in forwards;
  }
  dialog.closing::backdrop {
    animation: backdropFadeOut 0.3s ease-in forwards;
  }
  </style>
</head>

<script>
document.querySelectorAll('.vector-slide').forEach(slide => {
  const handleInteraction = (e) => {
    // Only process clicks and 'Enter' or 'Space' keys
    if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
    if (e.type === 'keydown') e.preventDefault(); // Prevent scroll on spacebar

    const link = slide.getAttribute("data-link");
    if (link) window.location.href = link;
  };
  
  slide.addEventListener('click', handleInteraction);
  slide.addEventListener('keydown', handleInteraction);
});

// Fallback for browsers that don't support scroll-driven animations (e.g. Safari < 18, Firefox)
if (!CSS.supports('(animation-timeline: view()) and (animation-range: entry)')) {
  const scroller = document.querySelector('.scroller');
  const entries = document.querySelectorAll('.vector-slide');
  const animations = new Map();
  
  entries.forEach(entry => {
    const overlay = entry.querySelector('.overlay');
    const text = entry.querySelector('.edition-text');
    
    const slideAnim = entry.animate({ transform: ['scale(0.85)', 'scale(1)', 'scale(0.85)'] }, { duration: 1, fill: 'both' });
    slideAnim.pause();
    
    const overlayAnim = overlay.animate(
      { backgroundColor: ['transparent', 'rgba(163,138,99,0.6)', 'rgba(234,156,30,0.35)', 'rgba(163,138,99,0.6)', 'transparent'] },
      { duration: 1, fill: 'both' }
    );
    overlayAnim.pause();
    
    const textAnim = text.animate(
      { opacity: ['0', '0.5', '1', '0.5', '0'] },
      { duration: 1, fill: 'both' }
    );
    textAnim.pause();
    
    animations.set(entry, { slideAnim, overlayAnim, textAnim });
  });
  
  const tick = () => {
    const scrollerRect = scroller.getBoundingClientRect();
    entries.forEach(entry => {
      const anims = animations.get(entry);
      if (!anims) return;
      const entryRect = entry.getBoundingClientRect();
      const progress = (entryRect.left + entryRect.width / 2 - scrollerRect.left) / scrollerRect.width;
      const p = Math.max(0, Math.min(1, progress));
      
      anims.slideAnim.currentTime = p;
      anims.overlayAnim.currentTime = p;
      anims.textAnim.currentTime = p;
    });
  };
  
  scroller.addEventListener('scroll', tick);
  window.addEventListener('resize', tick);
  tick();
}
</script>
