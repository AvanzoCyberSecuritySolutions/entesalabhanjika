server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Vite fingerprints built assets (content-hashed filenames), so they can
    # be cached forever; HTML must always be revalidated so a new deploy is
    # picked up immediately instead of being served stale from cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /derived/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }
}
